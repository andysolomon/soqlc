<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Title bar -->
  <text x="600" y="50" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">soqlc</text>
  <text x="600" y="76" fill="#7d8590" font-size="13" text-anchor="middle">.soql + schema → type-safe TypeScript</text>

  <!-- LEFT PANEL: .soql -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="540" height="520" rx="10" fill="#0b0f15" stroke="#30363d"/>
    <rect x="40" y="110" width="540" height="34" rx="10" fill="#161b22"/>
    <rect x="40" y="134" width="540" height="10" fill="#161b22"/>
    <circle cx="60" cy="127" r="6" fill="#ff5f57"/>
    <circle cx="80" cy="127" r="6" fill="#febc2e"/>
    <circle cx="100" cy="127" r="6" fill="#28c840"/>
    <text x="565" y="131" fill="#7d8590" text-anchor="end" font-size="12">queries/accounts.soql</text>
  </g>

  <g fill="#e6edf3">
    <text x="60" y="180"><tspan fill="#7d8590">-- name: GetAccountById :one</tspan></text>
    <text x="60" y="204"><tspan fill="#ff7b72">SELECT</tspan> Id, Name, Industry, AnnualRevenue</text>
    <text x="60" y="228"><tspan fill="#ff7b72">FROM</tspan> Account</text>
    <text x="60" y="252"><tspan fill="#ff7b72">WHERE</tspan> Id = <tspan fill="#a5d6ff">:id</tspan>;</text>

    <text x="60" y="296"><tspan fill="#7d8590">-- name: ListAccountsByIndustry :many</tspan></text>
    <text x="60" y="320"><tspan fill="#ff7b72">SELECT</tspan> Id, Name, AnnualRevenue</text>
    <text x="60" y="344"><tspan fill="#ff7b72">FROM</tspan> Account</text>
    <text x="60" y="368"><tspan fill="#ff7b72">WHERE</tspan> Industry = <tspan fill="#a5d6ff">:industry</tspan></text>
    <text x="60" y="392"><tspan fill="#ff7b72">ORDER BY</tspan> Name <tspan fill="#ff7b72">ASC</tspan></text>
    <text x="60" y="416"><tspan fill="#ff7b72">LIMIT</tspan> <tspan fill="#a5d6ff">:max</tspan>;</text>

    <text x="60" y="460"><tspan fill="#7d8590">-- name: GetAccountWithContacts :one</tspan></text>
    <text x="60" y="484"><tspan fill="#ff7b72">SELECT</tspan> Id, Name,</text>
    <text x="60" y="508">       (<tspan fill="#ff7b72">SELECT</tspan> Id, FirstName, LastName</text>
    <text x="60" y="532">        <tspan fill="#ff7b72">FROM</tspan> Contacts)</text>
    <text x="60" y="556"><tspan fill="#ff7b72">FROM</tspan> Account</text>
    <text x="60" y="580"><tspan fill="#ff7b72">WHERE</tspan> Id = <tspan fill="#a5d6ff">:id</tspan>;</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(600,360)">
    <line x1="-5" y1="0" x2="20" y2="0" stroke="#7d8590" stroke-width="2"/>
    <polygon points="20,-6 32,0 20,6" fill="#7d8590"/>
    <text x="14" y="-14" fill="#7d8590" text-anchor="middle" font-size="11">soqlc generate</text>
  </g>

  <!-- RIGHT PANEL: generated .ts -->
  <g filter="url(#shadow)">
    <rect x="640" y="110" width="520" height="520" rx="10" fill="#0b0f15" stroke="#30363d"/>
    <rect x="640" y="110" width="520" height="34" rx="10" fill="#161b22"/>
    <rect x="640" y="134" width="520" height="10" fill="#161b22"/>
    <circle cx="660" cy="127" r="6" fill="#ff5f57"/>
    <circle cx="680" cy="127" r="6" fill="#febc2e"/>
    <circle cx="700" cy="127" r="6" fill="#28c840"/>
    <text x="1145" y="131" fill="#7d8590" text-anchor="end" font-size="12">generated/accounts.ts</text>
  </g>

  <g fill="#e6edf3">
    <text x="660" y="178"><tspan fill="#7d8590">// Code generated by soqlc. DO NOT EDIT.</tspan></text>
    <text x="660" y="202"><tspan fill="#ff7b72">import type</tspan> { SoqlClient } <tspan fill="#ff7b72">from</tspan> <tspan fill="#a5d6ff">"soqlc/runtime"</tspan>;</text>
    <text x="660" y="226"><tspan fill="#ff7b72">import</tspan> { bindParams } <tspan fill="#ff7b72">from</tspan> <tspan fill="#a5d6ff">"soqlc/runtime"</tspan>;</text>

    <text x="660" y="270"><tspan fill="#ff7b72">export interface</tspan> <tspan fill="#ffa657">GetAccountByIdArgs</tspan> {</text>
    <text x="660" y="294">  id: <tspan fill="#ffa657">string</tspan>;</text>
    <text x="660" y="318">}</text>

    <text x="660" y="354"><tspan fill="#ff7b72">export interface</tspan> <tspan fill="#ffa657">GetAccountByIdRow</tspan> {</text>
    <text x="660" y="378">  Id: <tspan fill="#ffa657">string</tspan>;</text>
    <text x="660" y="402">  Name: <tspan fill="#ffa657">string</tspan>;</text>
    <text x="660" y="426">  Industry?: <tspan fill="#a5d6ff">"Tech"</tspan> | <tspan fill="#a5d6ff">"Finance"</tspan> | <tspan fill="#a5d6ff">"Healthcare"</tspan>;</text>
    <text x="660" y="450">  AnnualRevenue?: <tspan fill="#ffa657">number</tspan>;</text>
    <text x="660" y="474">}</text>

    <text x="660" y="510"><tspan fill="#ff7b72">export async function</tspan> <tspan fill="#d2a8ff">getAccountById</tspan>(</text>
    <text x="660" y="534">  client: <tspan fill="#ffa657">SoqlClient</tspan>,</text>
    <text x="660" y="558">  args: <tspan fill="#ffa657">GetAccountByIdArgs</tspan>,</text>
    <text x="660" y="582">): <tspan fill="#ff7b72">Promise</tspan>&lt;<tspan fill="#ffa657">GetAccountByIdRow</tspan> | <tspan fill="#79c0ff">null</tspan>&gt; {</text>
    <text x="660" y="606">  <tspan fill="#7d8590">// query + return records[0] ?? null</tspan></text>
  </g>
</svg>
